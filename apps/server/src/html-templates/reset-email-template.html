<!doctype html>

<html>
  <head>
    <link rel="stylesheet" href="./styles/main.css" />
    {{{inlineStyle}}}
  </head>
  <body>
    <h1 class="main-heading">Reset Your Email</h1>
    <p class="main-text">
      Hello there!<br />
      You have requested to reset your {{appName}} email. Please click the link below to continue
      the process.
    </p>

    <a href="{{url}}">
      <button class="main-button">Reset Your Email</button>
    </a>

    <p class="bottom-disclaimer" style="font-size: 12px; font-style: italic">
      If you didn't make this request, please ignore this message.
    </p>
  </body>
</html>
