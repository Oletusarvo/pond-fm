<!doctype html>

<html>
  <head>
    <link rel="stylesheet" href="./styles/main.css" />
    {{{inlineStyle}}}
  </head>
  <body>
    <h1 class="main-heading">Verify Your Email</h1>
    <p class="main-text">
      Hello there!<br />
      You have requested to register at {{appName}}. Please click the link below to continue the
      login process.
    </p>

    <a href="{{url}}">
      <button class="main-button">Verify Your Email</button>
    </a>

    <p class="bottom-disclaimer" style="font-size: 12px; font-style: italic">
      If you didn't request to register with us, please ignore this message.
    </p>
  </body>
</html>
